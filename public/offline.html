<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tidak Tersambung - SIPEKA</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #1f2a3d;
               font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; padding: 16px; box-sizing: border-box; }
        .kotak { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 32px 24px; max-width: 440px; text-align: center; }
        img { width: 72px; height: 72px; }
        h1 { font-size: 1.3rem; margin: 16px 0 8px; color: #163d7a; }
        ol { text-align: left; line-height: 1.6; padding-left: 1.2rem; }
        button { margin-top: 12px; background: #1f5fae; color: #fff; border: 0; border-radius: 8px; padding: 12px 24px; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="kotak">
        <img src="/icons/ikon-192.png" alt="">
        <h1>Tidak tersambung ke PC Kelurahan</h1>
        <p>Aplikasi SIPEKA butuh koneksi ke PC kelurahan (server). Coba periksa:</p>
        <ol>
            <li>Perangkat ini tersambung ke <b>WiFi kantor</b>.</li>
            <li><b>PC kelurahan menyala</b> dan jendela hitam <i>jalankan-jaringan.bat</i> masih terbuka.</li>
        </ol>
        <button onclick="location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
